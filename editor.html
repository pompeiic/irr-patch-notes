<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Incursion Red River — News &amp; Patch Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0c0c;
    --panel: #101010;
    --panel2: #161616;
    --border: rgba(232, 228, 216, 0.28);
    --border-strong: rgba(232, 228, 216, 0.55);
    --text: #e8e4d8;
    --dim: #9a9588;
    --accent: #c9b87a;
    --news: #c9b87a;
    --danger: #d47868;
    --danger-bg: rgba(80, 28, 22, 0.55);
    --topo: rgba(180, 160, 110, 0.14);
    --font-ui: "Barlow Condensed", "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    margin: 0;
    font-family: var(--font-mono);
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
  }
  ::placeholder { color: #706b5e; opacity: 1; }
  header {
    display: flex; align-items: center; gap: 14px;
    padding: 10px 18px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    font-family: var(--font-ui);
    font-size: 18px; font-weight: 600; margin: 0;
    letter-spacing: 2px; text-transform: uppercase;
  }
  header .spacer { flex: 1; }
  header input { width: 300px; }
  .tabs { display: flex; gap: 0; border: 1px solid var(--border-strong); }
  .tabs button {
    border: none; border-radius: 0; padding: 7px 16px;
    background: transparent; font-family: var(--font-ui);
    letter-spacing: 1.5px; text-transform: uppercase; font-weight: 600;
  }
  .tabs button.active { background: var(--accent); color: #14110a; }
  main { display: grid; grid-template-columns: 260px 1fr 1fr; gap: 0; height: calc(100vh - 53px); }
  .col { overflow-y: auto; padding: 14px; }
  #list { background: var(--panel); border-right: 1px solid var(--border); }
  .form-col { border-right: 1px solid var(--border); background: #0e0e0e; }

  .patch-item {
    padding: 10px 12px; margin-bottom: 8px; cursor: pointer;
    background: var(--panel2);
    border: 1px dashed var(--border);
  }
  .patch-item:hover { border-color: var(--border-strong); border-style: solid; }
  .patch-item.active { border-color: var(--accent); border-style: solid; }
  .patch-item .build { font-family: var(--font-ui); font-weight: 600; letter-spacing: 1px; text-transform: uppercase; font-size: 15px; }
  .patch-item .title { color: var(--dim); font-size: 12px; margin-top: 2px; }
  .patch-item .wipes { color: var(--danger); font-size: 11px; margin-top: 4px; letter-spacing: 0.5px; }
  .patch-item .major { color: var(--accent); font-size: 10px; letter-spacing: 2px; margin-top: 4px; font-family: var(--font-ui); font-weight: 600; }
  .patch-item .newsdate { color: var(--dim); font-size: 11px; }

  label {
    display: block; font-size: 11px; color: var(--dim); margin: 12px 0 4px;
    text-transform: uppercase; letter-spacing: 1.5px; font-family: var(--font-ui); font-weight: 600;
  }
  input[type=text], input[type=date], textarea {
    width: 100%; background: #0a0a0a; color: var(--text);
    border: 1px solid var(--border); border-radius: 0;
    padding: 8px 10px; font-size: 13px; font-family: var(--font-mono);
  }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); }
  textarea.body-md { min-height: 260px; font-size: 12px; resize: vertical; line-height: 1.45; }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  .checks {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
    background: var(--danger-bg); border: 1px dashed var(--danger); padding: 10px;
  }
  .checks label, .inline-check {
    display: flex; align-items: center; gap: 8px; margin: 0;
    text-transform: none; font-size: 12px; color: var(--text); cursor: pointer;
    font-family: var(--font-mono); letter-spacing: 0;
  }
  .checks .all { grid-column: 1 / -1; font-weight: 600; }

  button {
    background: #0a0a0a; color: var(--text);
    border: 1px solid var(--border-strong); border-radius: 0;
    padding: 7px 14px; font-size: 12px; cursor: pointer;
    font-family: var(--font-ui); letter-spacing: 1.5px; text-transform: uppercase; font-weight: 600;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary {
    background: transparent; color: var(--text); border-color: var(--border-strong);
    clip-path: polygon(7px 0, 100% 0, 100% calc(100% - 7px), calc(100% - 7px) 100%, 0 100%, 0 7px);
  }
  button.primary:hover { border-color: var(--accent); color: var(--accent); }
  button.danger { color: var(--danger); border-color: var(--danger); }
  .toolbar { display: flex; gap: 6px; margin: 6px 0; }
  .toolbar button { padding: 4px 10px; font-size: 11px; clip-path: none; }
  .actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  small.hint { color: var(--dim); font-family: var(--font-mono); letter-spacing: 0; text-transform: none; font-weight: 400; }

  /* —— Live preview (in-game mock) —— */
  #preview {
    background: #080808;
    display: flex; align-items: flex-start; justify-content: center;
    padding: 18px;
  }
  #preview .paper {
    width: 100%; max-width: 520px; margin: 0 auto;
    display: flex; flex-direction: column; gap: 14px;
    min-height: 0;
  }

  /* Patch notes popup — grid */
  .patch-preview {
    position: relative;
    background-color: #0d0d0d;
    background-image:
      linear-gradient(rgba(140,140,140,0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(140,140,140,0.07) 1px, transparent 1px);
    background-size: 28px 28px, 28px 28px;
    border: 1px solid var(--border);
    padding: 22px 24px 20px;
  }
  .patch-preview::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: radial-gradient(circle, rgba(180,180,180,0.35) 1px, transparent 1.5px);
    background-size: 28px 28px;
    background-position: -1px -1px;
    opacity: 0.35;
  }
  .patch-preview > * { position: relative; z-index: 1; }
  .preview-headline {
    font-family: var(--font-ui);
    font-size: 28px; font-weight: 700; letter-spacing: 2px;
    text-transform: uppercase; color: var(--text);
    margin: 0 0 12px;
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  }
  .headline-tag {
    font-size: 13px; font-weight: 600; letter-spacing: 2px;
    color: var(--accent);
  }
  .preview-scroll {
    min-height: 120px; max-height: 420px;
    overflow-y: auto;
    border: 1px solid rgba(120, 180, 220, 0.35);
    padding: 14px 16px;
    scrollbar-width: thin;
    scrollbar-color: var(--accent) transparent;
  }
  .preview-scroll::-webkit-scrollbar { width: 6px; }
  .preview-scroll::-webkit-scrollbar-thumb { background: var(--accent); }
  .preview-scroll::-webkit-scrollbar-track { background: transparent; }
  .wipe-banner {
    background: var(--danger-bg); border: 1px dashed var(--danger);
    padding: 8px 12px; margin-bottom: 12px; font-size: 12px; color: var(--text);
  }
  .notes { font-size: 13px; line-height: 1.55; color: var(--text); }
  .notes p { margin: 0 0 10px; }
  .notes h3 {
    font-family: var(--font-ui); font-size: 15px; font-weight: 600;
    letter-spacing: 2px; text-transform: uppercase;
    border-bottom: 1px solid var(--border); padding-bottom: 4px; margin: 16px 0 8px;
  }
  .notes ul { margin: 4px 0 12px; padding-left: 0; list-style: none; }
  .notes li { position: relative; padding-left: 14px; margin: 3px 0; }
  .notes li::before { content: "-"; position: absolute; left: 0; color: var(--dim); }
  .preview-footer { display: flex; flex-direction: row; justify-content: center; align-items: center; gap: 14px; margin-top: 4px; flex-wrap: wrap; }
  .continue-btn, .steam-btn {
    display: inline-block; min-width: 160px; text-align: center;
    padding: 10px 28px; background: #0a0a0a; color: var(--text);
    border: 1px solid var(--border-strong);
    font-family: var(--font-ui); font-weight: 700; font-size: 14px;
    letter-spacing: 2px; text-transform: uppercase; text-decoration: none;
    clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
    pointer-events: none; /* preview only */
  }
  .steam-btn { pointer-events: auto; color: var(--accent); border-color: var(--accent); }

  /* News / inbox briefing mock */
  .news-preview {
    background: rgba(0, 0, 0, 0.92);
    border: 1px solid var(--border-strong);
    padding: 18px 20px 22px;
  }
  .msg-header {
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  }
  .msg-re {
    font-family: var(--font-mono); font-size: 14px; font-weight: 500;
    letter-spacing: 0.5px; text-transform: uppercase;
  }
  .msg-date { font-size: 12px; color: var(--text); white-space: nowrap; }
  .msg-rule {
    height: 0; border: none; border-top: 1px dashed var(--border-strong);
    margin: 10px 0 14px;
  }
  .news-preview .notes { font-size: 12px; line-height: 1.5; color: #c8c4b8; }

  #status {
    position: fixed; bottom: 16px; right: 16px; padding: 10px 16px;
    background: var(--panel2); border: 1px solid var(--border); display: none;
    max-width: 420px; font-size: 12px; font-family: var(--font-mono);
  }
  #status.ok { border-color: var(--accent); }
  #status.err { border-color: var(--danger); }
</style>
</head>
<body>
<header>
  <h1>INCURSION RED RIVER — NEWS &amp; PATCH NOTES</h1>
  <div class="tabs">
    <button id="tabPatches" class="active">Patch notes</button>
    <button id="tabNews" class="news-tab">News</button>
  </div>
  <button id="newBtn" class="primary">+ New entry</button>
  <div class="spacer"></div>
  <input type="text" id="token" placeholder="GitHub token (repo contents write)" title="Fine-grained PAT with read/write Contents on this repo. Stored only in this browser.">
  <button id="saveToken">Remember</button>
</header>
<main>
  <div class="col" id="list"></div>

  <!-- Patch form -->
  <div class="col form-col" id="form">
    <div class="row">
      <div><label>Build *</label><input type="text" id="build" placeholder="#1.3.1.0"></div>
      <div><label>Date *</label><input type="date" id="date"></div>
    </div>
    <label>Title * — <small class="hint">not shown in-game yet, cosmetic/manifest only</small></label><input type="text" id="title" placeholder="The Safehouse Update">
    <label>Steam announcement URL</label><input type="text" id="steam" placeholder="https://store.steampowered.com/news/app/…/view/…">
    <label style="margin-top:14px"><span class="inline-check"><input type="checkbox" id="major"> Major update (highlighted in-game)</span></label>
    <label>Save wipes — union across missed patches applies to late updaters</label>
    <div class="checks">
      <label class="all"><input type="checkbox" data-flag="bDeleteAllSaveGames"> Wipe EVERYTHING</label>
      <label><input type="checkbox" data-flag="bDeleteMissionSaveGame"> Mission progress</label>
      <label><input type="checkbox" data-flag="bDeleteWorldSaveGame"> World state</label>
      <label><input type="checkbox" data-flag="bDeleteSafehouseSaveGame"> Safehouse</label>
      <label><input type="checkbox" data-flag="bDeleteVendorSaveGame"> Vendor</label>
      <label><input type="checkbox" data-flag="bDeleteStashSaveGame"> Stash</label>
      <label><input type="checkbox" data-flag="bDeleteInventorySaveGame"> Inventory</label>
      <label><input type="checkbox" data-flag="bDeleteGameSettingsSaveGame"> Game settings</label>
    </div>
    <label>Patch notes — <small class="hint">"## " section &nbsp;•&nbsp; "- " bullet &nbsp;•&nbsp; **bold** (matches in-game rendering)</small></label>
    <div class="toolbar" data-target="notes">
      <button data-md="## ">Section</button>
      <button data-md="- ">Bullet</button>
      <button data-md="**">Bold</button>
    </div>
    <textarea id="notes" class="body-md" placeholder="## Gameplay&#10;- Added the safehouse generator&#10;- **Reworked** vendor stock rotation"></textarea>
    <div class="actions">
      <button id="applyBtn" class="primary">Apply to list</button>
      <button id="deleteBtn" class="danger">Delete entry</button>
      <span style="flex:1"></span>
      <button id="commitBtn" class="primary">Commit to GitHub</button>
      <button id="copyBtn">Copy JSON</button>
    </div>
  </div>

  <!-- News form -->
  <div class="col form-col" id="newsForm" style="display:none">
    <div class="row">
      <div><label>Date *</label><input type="date" id="newsDate"></div>
      <div><label>Id — <small class="hint">auto-generated from date + title, fixed once created</small></label><input type="text" id="newsId" placeholder="(assigned on Apply)" readonly tabindex="-1" style="opacity:.6;cursor:default"></div>
    </div>
    <label>Title *</label><input type="text" id="newsTitle" placeholder="Community Event: Long Night">
    <label>Link URL (Steam, Discord, …)</label><input type="text" id="newsLink" placeholder="https://…">
    <label>Body * — <small class="hint">"## " section &nbsp;•&nbsp; "- " bullet &nbsp;•&nbsp; **bold** — lands in the player inbox</small></label>
    <div class="toolbar" data-target="newsBody">
      <button data-md="## ">Section</button>
      <button data-md="- ">Bullet</button>
      <button data-md="**">Bold</button>
    </div>
    <textarea id="newsBody" class="body-md" placeholder="Operators,&#10;&#10;this weekend the **Long Night** event runs on all maps.&#10;- Night raids only&#10;- Double vendor payouts"></textarea>
    <div class="actions">
      <button id="newsApplyBtn" class="primary">Apply to list</button>
      <button id="newsDeleteBtn" class="danger">Delete entry</button>
      <span style="flex:1"></span>
      <button id="newsCommitBtn" class="primary">Commit to GitHub</button>
      <button id="newsCopyBtn">Copy JSON</button>
    </div>
  </div>

  <div class="col" id="preview"><div class="paper" id="paper"></div></div>
</main>
<div id="status"></div>

<script>
const OWNER = "pompeiic", REPO = "irr-patch-notes", BRANCH = "main";
const FLAGS = ["bDeleteAllSaveGames","bDeleteGameSettingsSaveGame","bDeleteMissionSaveGame","bDeleteWorldSaveGame",
               "bDeleteVendorSaveGame","bDeleteStashSaveGame","bDeleteInventorySaveGame","bDeleteSafehouseSaveGame"];
const FLAG_LABELS = { bDeleteAllSaveGames:"EVERYTHING", bDeleteGameSettingsSaveGame:"Settings", bDeleteMissionSaveGame:"Missions",
  bDeleteWorldSaveGame:"World", bDeleteVendorSaveGame:"Vendor", bDeleteStashSaveGame:"Stash",
  bDeleteInventorySaveGame:"Inventory", bDeleteSafehouseSaveGame:"Safehouse" };

let mode = "patches";           // "patches" | "news"
let patches = [], news = [];
let selected = -1;              // index into the current mode's array

const $ = id => document.getElementById(id);
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const items = () => mode === "patches" ? patches : news;

function parseVersion(b) {
  const nums = (b.match(/\d+/g) || []).map(Number);
  while (nums.length < 4) nums.push(0);
  return nums.slice(0, 4);
}
function cmpVersion(a, b) {
  const va = parseVersion(a), vb = parseVersion(b);
  for (let i = 0; i < 4; i++) if (va[i] !== vb[i]) return va[i] - vb[i];
  return 0;
}
function wipeSummary(p) {
  if (p.bDeleteAllSaveGames) return "Wipes EVERYTHING";
  const parts = FLAGS.filter(f => f !== "bDeleteAllSaveGames" && p[f]).map(f => FLAG_LABELS[f]);
  return parts.length ? "Wipes " + parts.join(", ") : "";
}
function slug(s) {
  return s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "").slice(0, 48);
}

function notesToHtml(md) {
  const lines = md.replace(/\r\n/g, "\n").split("\n");
  let html = "", inList = false;
  const inline = s => esc(s).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  for (const line of lines) {
    if (line.startsWith("- ")) { if (!inList) { html += "<ul>"; inList = true; } html += "<li>" + inline(line.slice(2)) + "</li>"; continue; }
    if (inList) { html += "</ul>"; inList = false; }
    if (line.startsWith("## ")) html += "<h3>" + esc(line.slice(3).trim()) + "</h3>";
    else if (line.trim()) html += "<p>" + inline(line) + "</p>";
  }
  if (inList) html += "</ul>";
  return html;
}

function renderList() {
  const el = $("list");
  el.innerHTML = "";
  items().forEach((p, i) => {
    const div = document.createElement("div");
    div.className = "patch-item" + (i === selected ? " active" : "");
    if (mode === "patches") {
      const wipes = wipeSummary(p);
      div.innerHTML = `<div class="build">${esc(p.Build || "?")}</div><div class="title">${esc(p.Title || "")}</div>`
        + (p.bMajorUpdate ? `<div class="major">MAJOR UPDATE</div>` : "")
        + (wipes ? `<div class="wipes">${esc(wipes)}</div>` : "");
    } else {
      div.innerHTML = `<div class="build">${esc(p.Title || "?")}</div><div class="newsdate">${esc((p.Date || "").slice(0, 10))}</div>`
        + `<div class="title">${esc(p.Id || "")}</div>`;
    }
    div.onclick = () => { select(i); };
    el.appendChild(div);
  });
}

function formatDateDot(iso) {
  const d = (iso || "").slice(0, 10);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) return d;
  return d.slice(8, 10) + "." + d.slice(5, 7) + "." + d.slice(0, 4);
}

function renderPreview() {
  if (mode === "patches") {
    const p = patchFromForm();
    const wipes = wipeSummary(p);
    $("paper").className = "paper patch-preview";
    $("paper").innerHTML =
      `<div class="preview-headline">${esc(p.Build || "#0.0.0.0")}<span class="headline-tag">${p.bMajorUpdate ? "MAJOR UPDATE" : "HOTFIX"}</span></div>` +
      `<div class="preview-scroll">` +
        (wipes ? `<div class="wipe-banner">⚠ THIS UPDATE RESETS: <b>${esc(wipes.replace("Wipes ", "").toUpperCase())}</b></div>` : "") +
        `<div class="notes">${notesToHtml(p.PatchNotes || "")}</div>` +
      `</div>` +
      `<div class="preview-footer">` +
        `<div class="continue-btn">Continue</div>` +
        (p.SteamAnnouncementURL ? `<a class="steam-btn" href="${esc(p.SteamAnnouncementURL)}" target="_blank" rel="noopener">Steam</a>` : "") +
      `</div>`;
  } else {
    const n = newsFromForm();
    $("paper").className = "paper";
    $("paper").innerHTML =
      `<div class="news-preview">` +
        `<div class="msg-header">` +
          `<div class="msg-re">RE: ${esc(n.Title || "MESSAGE HEADLINE")}</div>` +
          `<div class="msg-date">${esc(formatDateDot(n.Date))}</div>` +
        `</div>` +
        `<hr class="msg-rule">` +
        `<div class="notes">${notesToHtml(n.Body || "")}</div>` +
      `</div>` +
      (n.LinkURL
        ? `<div class="preview-footer"><a class="steam-btn" href="${esc(n.LinkURL)}" target="_blank" rel="noopener">Steam</a></div>`
        : "");
  }
}

function select(i) {
  selected = i;
  const p = items()[i];
  if (mode === "patches") {
    $("build").value = p.Build || "";
    $("date").value = (p.Date || "").slice(0, 10);
    $("title").value = p.Title || "";
    $("steam").value = p.SteamAnnouncementURL || "";
    $("major").checked = !!p.bMajorUpdate;
    document.querySelectorAll("[data-flag]").forEach(cb => cb.checked = !!p[cb.dataset.flag]);
    $("notes").value = p.PatchNotes || "";
  } else {
    $("newsId").value = p.Id || "";
    $("newsDate").value = (p.Date || "").slice(0, 10);
    $("newsTitle").value = p.Title || "";
    $("newsLink").value = p.LinkURL || "";
    $("newsBody").value = p.Body || "";
  }
  renderList(); renderPreview();
}

function clearForm() {
  selected = -1;
  if (mode === "patches") {
    $("build").value = ""; $("title").value = ""; $("steam").value = ""; $("notes").value = "";
    $("date").value = new Date().toISOString().slice(0, 10);
    $("major").checked = false;
    document.querySelectorAll("[data-flag]").forEach(cb => cb.checked = false);
  } else {
    $("newsId").value = ""; $("newsTitle").value = ""; $("newsLink").value = ""; $("newsBody").value = "";
    $("newsDate").value = new Date().toISOString().slice(0, 10);
  }
  renderList(); renderPreview();
}

function patchFromForm() {
  const p = {
    Build: $("build").value.trim(),
    Date: ($("date").value || new Date().toISOString().slice(0, 10)) + "T12:00:00",
    Title: $("title").value.trim(),
    PatchNotes: $("notes").value,
    SteamAnnouncementURL: $("steam").value.trim(),
    bMajorUpdate: $("major").checked
  };
  document.querySelectorAll("[data-flag]").forEach(cb => p[cb.dataset.flag] = cb.checked);
  return p;
}

function newsFromForm() {
  return {
    //Existing entries keep their published Id verbatim — the game's import-once tracking keys on it.
    Id: selected >= 0 && news[selected] ? news[selected].Id : "",
    Date: ($("newsDate").value || new Date().toISOString().slice(0, 10)) + "T12:00:00",
    Title: $("newsTitle").value.trim(),
    Body: $("newsBody").value,
    LinkURL: $("newsLink").value.trim()
  };
}

//New entries get "YYYY-MM-DD-title-slug", suffixed -2/-3/… on collision. Never re-run for existing ids.
function generateNewsId(n) {
  const base = n.Date.slice(0, 10) + "-" + (slug(n.Title) || "untitled");
  let id = base, i = 2;
  while (news.some(x => x.Id === id)) id = base + "-" + i++;
  return id;
}

function applyForm() {
  if (mode === "patches") {
    const p = patchFromForm();
    if (!p.Build || !/\d/.test(p.Build)) return status("Build is required, e.g. #1.3.1.0", true);
    if (!p.Title) return status("Title is required", true);
    const dupe = patches.findIndex((x, i) => i !== selected && cmpVersion(x.Build, p.Build) === 0);
    if (dupe >= 0) return status("A patch with build " + p.Build + " already exists", true);
    if (selected >= 0) patches[selected] = p; else { patches.push(p); selected = patches.length - 1; }
    patches.sort((a, b) => cmpVersion(b.Build, a.Build));
    selected = patches.findIndex(x => cmpVersion(x.Build, p.Build) === 0);
  } else {
    const n = newsFromForm();
    if (!n.Title) return status("Title is required", true);
    if (!n.Body.trim()) return status("Body is required", true);
    if (!n.Id) { n.Id = generateNewsId(n); }
    $("newsId").value = n.Id;
    if (selected >= 0) news[selected] = n; else { news.push(n); selected = news.length - 1; }
    news.sort((a, b) => (b.Date || "").localeCompare(a.Date || ""));
    selected = news.findIndex(x => x.Id === n.Id);
  }
  renderList(); renderPreview();
  status("Applied. Remember to commit.");
  return true;
}

function status(msg, isErr) {
  const el = $("status");
  el.textContent = msg;
  el.className = isErr ? "err" : "ok";
  el.style.display = "block";
  clearTimeout(el._t);
  el._t = setTimeout(() => el.style.display = "none", 5000);
  return !isErr;
}

const fileFor = m => m === "patches" ? "patches.json" : "news.json";
function manifestJson() {
  return mode === "patches"
    ? JSON.stringify({ Patches: patches }, null, 2) + "\n"
    : JSON.stringify({ News: news }, null, 2) + "\n";
}

async function commit() {
  if (selected >= 0 && !applyForm()) return;
  const token = $("token").value.trim();
  if (!token) return status("Paste a GitHub token first (top right)", true);
  const file = fileFor(mode);
  const api = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${file}`;
  const headers = { "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json" };
  try {
    const cur = await fetch(api + "?ref=" + BRANCH, { headers });
    let sha = undefined;
    if (cur.ok) sha = (await cur.json()).sha;
    else if (cur.status === 401) throw new Error("GitHub rejected the token (401) — it expired, was regenerated, or was pasted incompletely. Create/copy a fresh token, paste it top-right and click Remember.");
    else if (cur.status !== 404) throw new Error("Fetching current file failed: " + cur.status);
    const body = {
      message: "Update " + file + " (editor)",
      content: btoa(unescape(encodeURIComponent(manifestJson()))),
      branch: BRANCH
    };
    if (sha) body.sha = sha;
    const put = await fetch(api, { method: "PUT", headers, body: JSON.stringify(body) });
    if (!put.ok) throw new Error("Commit failed: " + put.status + " " + (await put.text()).slice(0, 200));
    status("Committed " + file + ". Live on the site in ~1 minute.");
  } catch (e) { status(e.message, true); }
}

async function load() {
  try {
    const res = await fetch("patches.json?t=" + Date.now());
    const data = await res.json();
    patches = data.Patches || data || [];
    patches.sort((a, b) => cmpVersion(b.Build, a.Build));
  } catch (e) { status("Could not load patches.json: " + e.message, true); }
  try {
    const res = await fetch("news.json?t=" + Date.now());
    const data = await res.json();
    news = data.News || data || [];
    news.sort((a, b) => (b.Date || "").localeCompare(a.Date || ""));
  } catch (e) { /* news.json may not exist yet */ }
  if (items().length) select(0); else clearForm();
}

function setMode(m) {
  mode = m;
  selected = -1;
  $("tabPatches").classList.toggle("active", m === "patches");
  $("tabNews").classList.toggle("active", m === "news");
  $("form").style.display = m === "patches" ? "" : "none";
  $("newsForm").style.display = m === "news" ? "" : "none";
  if (items().length) select(0); else clearForm();
}

$("tabPatches").onclick = () => setMode("patches");
$("tabNews").onclick = () => setMode("news");
$("newBtn").onclick = clearForm;
$("applyBtn").onclick = applyForm;
$("newsApplyBtn").onclick = applyForm;
$("deleteBtn").onclick = $("newsDeleteBtn").onclick = () => {
  if (selected < 0) return;
  const label = mode === "patches" ? (items()[selected].Build || "") : (items()[selected].Id || "");
  if (!confirm("Delete " + label + " from the manifest?")) return;
  items().splice(selected, 1); selected = -1;
  renderList(); renderPreview();
  status("Deleted locally. Remember to commit.");
};
$("commitBtn").onclick = $("newsCommitBtn").onclick = commit;
$("copyBtn").onclick = $("newsCopyBtn").onclick = () => {
  if (selected < 0 || applyForm()) { navigator.clipboard.writeText(manifestJson()); status("Manifest JSON copied."); }
};
$("saveToken").onclick = () => { localStorage.setItem("irr_pat", $("token").value.trim()); status("Token stored in this browser."); };
document.querySelectorAll(".toolbar [data-md]").forEach(btn => btn.onclick = () => {
  const ta = $(btn.closest(".toolbar").dataset.target), md = btn.dataset.md, s = ta.selectionStart, e = ta.selectionEnd, v = ta.value;
  if (md === "**") ta.value = v.slice(0, s) + "**" + v.slice(s, e) + "**" + v.slice(e);
  else ta.value = v.slice(0, s) + (s === 0 || v[s - 1] === "\n" ? "" : "\n") + md + v.slice(s);
  ta.focus(); renderPreview();
});
["build","date","title","steam","notes","newsId","newsDate","newsTitle","newsLink","newsBody"]
  .forEach(id => $(id).addEventListener("input", renderPreview));
$("major").addEventListener("change", renderPreview);
document.querySelectorAll("[data-flag]").forEach(cb => cb.addEventListener("change", renderPreview));
$("token").value = localStorage.getItem("irr_pat") || "";
load();
</script>
</body>
</html>
